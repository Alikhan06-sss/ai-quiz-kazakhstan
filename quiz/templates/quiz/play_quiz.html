<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ quiz.title }} - AI Quiz</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #fff; }
        .quiz-card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 600px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 25px; }

        .choice-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 2px solid #334155; background: #0f172a; color: white; font-size: 16px;
            cursor: pointer; transition: 0.3s; text-align: left;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .choice-btn:hover:not(:disabled) { background: #1e293b; border-color: #475569; }

        .correct { background: #059669 !important; border-color: #10b981 !important; }
        .wrong { background: #dc2626 !important; border-color: #ef4444 !important; }
        .missed { opacity: 0.5; } /* Тусклый цвет для неправильных, если время вышло */

        .leaderboard-table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        .leaderboard-table td, .leaderboard-table th { padding: 10px; border-bottom: 1px solid #334155; }
        .top-1 { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-card" id="quiz-box">
    <div id="progress" style="margin-bottom: 10px; opacity: 0.8; display: flex; justify-content: space-between; font-size: 1.1rem;"></div>
    <h2 id="question-text">Загрузка...</h2>
    <div id="choices-container"></div>
</div>

<script>
    const questions = [
        {% for q in questions %}
        {
            text: "{{ q.text|escapejs }}",
            choices: [
                {% for c in q.choices.all %}
                { text: "{{ c.text|escapejs }}", is_correct: {{ c.is_correct|yesno:"true,false" }} },
                {% endfor %}
            ]
        },
        {% endfor %}
    ];

    let currentStep = 0;
    let score = 0;

    // ПЕРЕМЕННЫЕ ДЛЯ ТАЙМЕРА
    let timeLeft = 15;
    let timerInterval;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function updateScoreLive() {
        fetch(`/save_result/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `score=${score}`
        }).catch(err => console.log(err));
    }

    // ЛОГИКА ТАЙМЕРА
    function startTimer() {
        timeLeft = 15;
        updateTimerDisplay();
        clearInterval(timerInterval); // Очищаем старый таймер

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOut(); // Вызываем функцию проигрыша по времени
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const progressEl = document.getElementById('progress');
        // Если осталось 5 секунд или меньше - красим в красный
        const timeColor = timeLeft <= 5 ? '#ef4444' : '#38bdf8';
        progressEl.innerHTML = `
            <span>Вопрос ${currentStep + 1} из ${questions.length}</span>
            <span style="color: ${timeColor}; font-weight: bold;">⏳ ${timeLeft} сек</span>
        `;
    }

    function timeOut() {
        const allBtns = document.querySelectorAll('.choice-btn');
        const q = questions[currentStep];

        // Блокируем все кнопки
        allBtns.forEach(btn => {
            btn.disabled = true;
            // Ищем, какая из кнопок содержит правильный текст
            const originalChoice = q.choices.find(c => c.text === btn.innerText);
            if (originalChoice && originalChoice.is_correct) {
                btn.classList.add('correct'); // Подсвечиваем правильный
            } else {
                btn.classList.add('missed'); // Делаем остальные тусклыми
            }
        });

        // Ждем 2 секунды, чтобы ученик увидел правильный ответ, и идем дальше
        setTimeout(nextStep, 2000);
    }

    function loadQuestion() {
        const q = questions[currentStep];
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        document.getElementById('question-text').innerText = q.text;

        let currentChoices = [...q.choices];
        shuffleArray(currentChoices);

        currentChoices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = () => checkAnswer(btn, choice.is_correct, currentChoices);
            container.appendChild(btn);
        });

        startTimer(); // Запускаем таймер как только кнопки появились
    }

    function checkAnswer(btn, isCorrect, currentChoices) {
        clearInterval(timerInterval); // Останавливаем таймер, ученик успел!

        const allBtns = document.querySelectorAll('.choice-btn');
        allBtns.forEach(b => b.disabled = true);

        if (isCorrect) {
            btn.classList.add('correct');
            score++;
            updateScoreLive();
        } else {
            btn.classList.add('wrong');
            allBtns.forEach((b, idx) => {
                if (currentChoices[idx].is_correct) b.classList.add('correct');
            });
        }

        setTimeout(nextStep, 1500);
    }

    // Вынесли переход к следующему шагу в отдельную функцию
    function nextStep() {
        currentStep++;
        if (currentStep < questions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        // Убедимся, что финальный счет точно отправился
        updateScoreLive();

        fetch(`/api/leaderboard/{{ quiz.id }}/`)
        .then(res => res.json())
        .then(data => {
            showLeaderboard(data.leaders);
        });
    }

    function showLeaderboard(leaders) {
        const box = document.getElementById('quiz-box');

        box.innerHTML = `
            <h2>Тест окончен!</h2>
            <p style="font-size: 1.2rem;">Твой результат: ${score} из ${questions.length}</p>
            <hr style="border: 1px solid #334155; margin: 20px 0;">
            <h3 style="color: #38bdf8;">🏆 Список лидеров (Live)</h3>
            <table class="leaderboard-table">
                <thead><tr><th>#</th><th>Имя</th><th>Баллы</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
            <button class="choice-btn" style="text-align:center; margin-top:20px" onclick="window.location.href='/'">Выйти</button>
        `;

        function updateTable() {
            fetch(`/api/leaderboard/{{ quiz.id }}/`)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('leaderboard-body');
                if (tbody) {
                    tbody.innerHTML = data.leaders.map((l, i) => `
                        <tr class="${i === 0 ? 'top-1' : ''}">
                            <td>${i + 1}</td>
                            <td>${l.name}</td>
                            <td>${l.score}</td>
                        </tr>
                    `).join('');
                }
            })
            .catch(err => console.error(err));
        }

        updateTable();
        setInterval(updateTable, 3000);
    }

    if (questions.length > 0) loadQuestion();
</script>
</body>
</html>
