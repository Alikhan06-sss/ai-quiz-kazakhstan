<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления AI Quiz</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a; /* Темный глубокий фон */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h2 { color: #38bdf8; margin-bottom: 30px; text-align: center; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #94a3b8; }

        input[type="text"], input[type="password"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        textarea { resize: vertical; min-height: 100px; }

        button {
            width: 100%;
            padding: 15px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #7dd3fc; transform: scale(1.02); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Создать новый тест</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Секретный код учителя</label>
                <input type="password" name="teacher_code" required>
            </div>

            <div class="form-group">
                <label>Название курса / темы</label>
                <input type="text" name="title" placeholder="Например: Основы Python" required>
            </div>

            <div class="form-group">
                <label>Вставьте текст лекции</label>
                <textarea name="text" placeholder="ИИ проанализирует этот текст..."></textarea>
            </div>

            <div class="form-group">
                <label>ИЛИ загрузите документ (PDF/DOCX)</label>
                <input type="file" name="document" accept=".pdf, .docx">
            </div>

            <button type="submit">Сгенерировать магию ИИ ✨</button>
        </form>
        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>
</body>
</html>
